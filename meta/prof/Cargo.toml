[package]
name = "nixprof"
version = "0.1.0"
edition = "2021"
description = "General-purpose Nix and command profiler, flamegraph/Speedscope generator, cache-invalidation analyzer, and CI telemetry tool."

[dependencies]
clap = { version = "4", features = ["derive"] }
inferno = { version = "0.12", default-features = false }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
strip = true
