id = "tuf"
description = "AC lid-closed opportunistic compute-donor laptop Superagent (Soft conditional DC-NATS-Pull worker, ZERO ghost offers!)."
attributes = ["auth:principal", "role:workstation", "role:compute-worker", "role:mesh-member", "posture:roaming", "env:dev"]
profiles = ["base-workstation"]
contains = [
  {agent = "compute-nats-worker"},
]

[[promises]]
ptype = "ext:service"
key = "mesh:control"
polarity = "use"
cardinality = "broadcast"
mandatory = true
tags = ["mesh-control"]
selector = {kind = "atom", tag = "mesh-control"}

[[promises]]
ptype = "ext:service"
key = "cache:cdn"
polarity = "use"
cardinality = "broadcast"
mandatory = true
tags = ["cdn-read"]
selector = {kind = "atom", tag = "cdn-read"}

[[promises]]
ptype = "mesh:service"
key = "obs-ingest"
polarity = "use"
cardinality = "broadcast"
mandatory = true
tags = ["zone:mesh", "obs-ingest"]
selector = {kind = "atom", tag = "obs-ingest"}

[[promises]]
ptype = "mesh:service"
key = "nats-broker"
polarity = "use"
cardinality = "broadcast"
mandatory = true
tags = ["zone:mesh", "nats-broker"]
selector = {kind = "atom", tag = "nats-broker"}

[[internal_promises]]
ptype = "ram"
key = "ram"
polarity = "offer"
cardinality = "budgeted"
mandatory = true
amount = 16384

[[internal_promises]]
ptype = "config:hostname"
key = "config:hostname"
polarity = "offer"
cardinality = "exclusive"
mandatory = true
[internal_promises.payload]
value = "tuf"

[[internal_promises]]
ptype = "config:primary-user"
key = "config:primary-user"
polarity = "offer"
cardinality = "exclusive"
mandatory = true
[internal_promises.payload]
name = "lw"
