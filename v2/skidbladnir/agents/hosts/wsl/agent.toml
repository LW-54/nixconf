id = "wsl"
description = "Diskless NixOS-WSL workstation Superagent (orthogonal target-nixos-wsl + fs-simple-disk, ZERO ghost offers!)."
attributes = ["auth:principal", "role:workstation", "role:mesh-member", "posture:roaming", "env:dev"]
contains = [
  {agent = "target-nixos-wsl"},
  {agent = "fs-simple-disk"},
  {agent = "trust-sops"},
  {agent = "mesh-tailscale"},
  {agent = "obs-fluent-node"},
  {agent = "git"},
]

[[promises]]
ptype = "ext:service"
key = "mesh:control"
polarity = "use"
cardinality = "broadcast"
mandatory = true
tags = ["mesh-control"]
selector = {kind = "atom", tag = "mesh-control"}

[[promises]]
ptype = "mesh:service"
key = "obs-ingest"
polarity = "use"
cardinality = "broadcast"
mandatory = true
tags = ["zone:mesh", "obs-ingest"]
selector = {kind = "atom", tag = "obs-ingest"}

[[internal_promises]]
ptype = "ram"
key = "ram"
polarity = "offer"
cardinality = "budgeted"
mandatory = true
amount = 4096

[[internal_promises]]
ptype = "config:hostname"
key = "config:hostname"
polarity = "offer"
cardinality = "exclusive"
mandatory = true
[internal_promises.payload]
value = "wsl"
