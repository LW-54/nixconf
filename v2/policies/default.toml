[[policies]]
id = "permit-servers-vault"
effect = "permit"
action = "read-secret"
principalPred = { kind = "atom", tag = "role:server" }
resourcePred = { kind = "atom", tag = "class:vault" }

[[policies]]
id = "permit-roaming-wifi"
effect = "permit"
action = "read-secret"
principalPred = { kind = "atom", tag = "posture:roaming" }
resourcePred = { kind = "atom", tag = "class:wifi" }

[[policies]]
id = "forbid-roaming-or-ai-vault"
effect = "forbid"
action = "read-secret"
principalPred = { kind = "union", left = { kind = "atom", tag = "posture:roaming" }, right = { kind = "atom", tag = "actor:ai-agent" } }
resourcePred = { kind = "atom", tag = "class:vault" }
