id = "obs-perses"
description = "UI-PersesPure 0.54.0 (ADR-0015, 90 MiB, 64 plugins): 100% swappable observability UI, zone:mesh ONLY!"

[[promises]]
ptype = "proxy:mesh"
key = "proxy:mesh"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "storage:durable"
key = "storage:durable"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "obs:metrics-api"
key = "obs:metrics-api"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "obs:traces-api"
key = "obs:traces-api"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "probe"
key = "panel-probes"
polarity = "use"
cardinality = "broadcast"
mandatory = false
selector = {kind = "any"}

[[promises]]
ptype = "state:persist"
key = "panel-state"
polarity = "use"
cardinality = "broadcast"
mandatory = false
selector = {kind = "any"}

[[promises]]
ptype = "http:route"
key = "perses"
polarity = "offer"
cardinality = "partitioned"
mandatory = true
tags = ["zone:mesh"]
[promises.payload]
subdomain = "perses"
port = 8080

[[promises]]
ptype = "state:persist"
key = "/var/lib/perses"
polarity = "offer"
cardinality = "broadcast"
mandatory = true
tags = ["survives-reboot", "backup-required", "single-auth-writer"]
[promises.payload]
path = "/var/lib/perses"

[[promises]]
ptype = "probe"
key = "perses-ui"
polarity = "offer"
cardinality = "broadcast"
mandatory = true
tags = ["http", "advisory", "tier1"]
[promises.payload]
kind = "http_2xx"
target = "http://127.0.0.1:8080/api/v1/health"
slo = 0.995

[[promises]]
ptype = "ram"
key = "ram"
polarity = "use"
cardinality = "budgeted"
mandatory = true
amount = 90
priority = 1
