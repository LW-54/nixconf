id = "fs-impermanence"
description = "Pure orthogonal ephemeral-root impermanence substrate (tmpfs / + /persist bind-mounts; decoupled from Btrfs/btrbk!)."
attributes = ["foreign:nixos-module"]

[[promises]]
ptype = "storage:root"
key = "storage:root"
polarity = "offer"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "storage:durable"
key = "storage:durable"
polarity = "offer"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "hw:physical-block"
key = "hw:physical-block"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "state:persist"
key = "/var/lib/nixos"
polarity = "offer"
cardinality = "broadcast"
mandatory = true
tags = ["survives-reboot", "backup-required", "single-auth-writer"]
[promises.payload]
path = "/var/lib/nixos"

[[promises]]
ptype = "state:persist"
key = "state:persist"
polarity = "use"
cardinality = "broadcast"
mandatory = false
[promises.selector]
kind = "diff"
[promises.selector.left]
kind = "atom"
tag = "survives-reboot"
[promises.selector.right]
kind = "union"
[promises.selector.right.left]
kind = "atom"
tag = "reconstructible"
[promises.selector.right.right]
kind = "atom"
tag = "external-owned"
