id = "caddy-public"
description = "Public HTTPS reverse proxy (Unification 6): strictly Partitioned zone:public, ZERO Tailscale dependency!"

[[promises]]
ptype = "config:domain"
key = "config:domain"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "http:route"
key = "http:route"
polarity = "use"
cardinality = "partitioned"
mandatory = false
selector = {kind = "atom", tag = "zone:public"}

[[promises]]
ptype = "proxy:public"
key = "proxy:public"
polarity = "offer"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "https:ingress"
key = "https:ingress"
polarity = "offer"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "state:persist"
key = "/var/lib/caddy"
polarity = "offer"
cardinality = "broadcast"
mandatory = true
tags = ["survives-reboot", "backup-required", "single-auth-writer"]
[promises.payload]
path = "/var/lib/caddy"

[[promises]]
ptype = "probe"
key = "caddy-public"
polarity = "offer"
cardinality = "broadcast"
mandatory = true
tags = ["http", "critical", "tier0"]
[promises.payload]
kind = "systemd_active"
unit = "caddy.service"
slo = 0.999

[[promises]]
ptype = "ram"
key = "ram"
polarity = "use"
cardinality = "budgeted"
mandatory = true
amount = 98
priority = 0
