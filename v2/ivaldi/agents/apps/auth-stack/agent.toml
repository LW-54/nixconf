id = "auth-stack"
description = "Dressed Superagent (P-Explicit) encapsulating LLDAP + Authelia (hides internal LDAP port 3890 behind Σ!)."
attributes = ["role:stack"]

contains = [
  {agent = "auth-lldap"},
  {agent = "auth-authelia"},
]

[[promises]]
ptype = "proxy:public"
key = "proxy:public"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "storage:durable"
key = "storage:durable"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "secrets:runtime"
key = "secrets:runtime"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "ram"
key = "ram"
polarity = "use"
cardinality = "budgeted"
mandatory = true
amount = 44
priority = 0

[[promises]]
ptype = "auth:oidc"
key = "auth:oidc"
polarity = "offer"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "http:route"
key = "auth"
polarity = "offer"
cardinality = "partitioned"
mandatory = true
tags = ["zone:public"]
[promises.payload]
subdomain = "auth"
port = 9091

[[promises]]
ptype = "secret:claim"
key = "lldap-jwt"
polarity = "offer"
cardinality = "broadcast"
mandatory = true
tags = ["class:auth", "env:prod"]

[[promises]]
ptype = "secret:claim"
key = "authelia-session"
polarity = "offer"
cardinality = "broadcast"
mandatory = true
tags = ["class:auth", "env:prod"]

[[promises]]
ptype = "state:persist"
key = "/var/lib/lldap"
polarity = "offer"
cardinality = "broadcast"
mandatory = true
tags = ["survives-reboot", "backup-required", "btrfs-snapshot", "single-auth-writer"]
[promises.payload]
path = "/var/lib/lldap"
prepare_cmd = "sqlite3-backup"

[[promises]]
ptype = "state:persist"
key = "/var/lib/authelia"
polarity = "offer"
cardinality = "broadcast"
mandatory = true
tags = ["survives-reboot", "backup-required", "btrfs-snapshot", "single-auth-writer"]
[promises.payload]
path = "/var/lib/authelia"
prepare_cmd = "sqlite3-backup"

[[promises]]
ptype = "probe"
key = "lldap-alive"
polarity = "offer"
cardinality = "broadcast"
mandatory = true
tags = ["tcp", "critical", "tier0"]
[promises.payload]
kind = "tcp"
port = 3890
slo = 0.999

[[promises]]
ptype = "probe"
key = "authelia-alive"
polarity = "offer"
cardinality = "broadcast"
mandatory = true
tags = ["http", "critical", "tier0"]
[promises.payload]
kind = "http_2xx"
target = "http://127.0.0.1:9091/api/health"
slo = 0.999
