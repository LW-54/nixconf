id = "target-nixos-iso"
description = "Read-only ephemeral NixOS Live-ISO target declared purely with raw promises."
attributes = ["foreign:nixos-module"]

[[promises]]
ptype = "config:hostname"
key = "config:hostname"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "target:os"
key = "target:os"
polarity = "offer"
cardinality = "exclusive"
mandatory = true
[promises.payload]
target_class = "nixos"
output_attr = "isoImage"

[[promises]]
ptype = "storage:root"
key = "storage:root"
polarity = "offer"
cardinality = "exclusive"
mandatory = true
