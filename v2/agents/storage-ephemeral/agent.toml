id = "storage-ephemeral"
description = "Ephemeral root filesystem with sealed impermanence binding `state:persist` purely via Partitioned AttrExpr (zero special state engine!)."
attributes = ["foreign:nixos-module"]

[[promises]]
ptype = "storage:root"
key = "storage:root"
polarity = "offer"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "storage:durable"
key = "storage:durable"
polarity = "offer"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "hw:physical-block"
key = "hw:physical-block"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "state:persist"
key = "/var/lib/nixos"
polarity = "offer"
cardinality = "partitioned"
mandatory = true
tags = ["survives-reboot", "single-auth-writer"]
[promises.payload]
path = "/var/lib/nixos"

[[promises]]
ptype = "state:persist"
key = "state:persist"
polarity = "use"
cardinality = "partitioned"
mandatory = false
[promises.selector]
kind = "diff"
[promises.selector.left]
kind = "atom"
tag = "survives-reboot"
[promises.selector.right]
kind = "union"
[promises.selector.right.left]
kind = "atom"
tag = "reconstructible"
[promises.selector.right.right]
kind = "atom"
tag = "external-owned"
