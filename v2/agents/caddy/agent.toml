id = "caddy"
description = "Public HTTPS reverse proxy declared purely with raw promises (zero sugar)."

[[promises]]
ptype = "config:domain"
key = "config:domain"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "http:route"
key = "http:route"
polarity = "use"
cardinality = "partitioned"
mandatory = false
selector = {kind = "atom", tag = "zone:public"}

[[promises]]
ptype = "proxy:https"
key = "proxy:https"
polarity = "offer"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "https:ingress"
key = "https:ingress"
polarity = "offer"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "ram"
key = "ram"
polarity = "use"
cardinality = "budgeted"
mandatory = true
amount = 128
priority = 0
