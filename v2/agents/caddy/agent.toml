id = "caddy"
description = "Public HTTPS reverse proxy binding partitioned `http:route` (`zone:public`) dynamically with zero hardcoded upstreams."

[requires."config:domain"]
kind = "exclusive"

[requires."http:route"]
kind = "partitioned"
mandatory = false
selector = {kind = "atom", tag = "zone:public"}

[offers."proxy:https"]
kind = "exclusive"

[offers."https:ingress"]
kind = "exclusive"

[budgets]
ram_mib = 128
tier = "critical"
