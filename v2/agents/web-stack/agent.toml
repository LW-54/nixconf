id = "web-stack"
description = "Nested Dressed Superagent (P-Explicit) declared purely with raw promises (zero sugar, zero piercing)."

contains = [
  {agent = "caddy"},
  {agent = "vaultwarden"},
]

[[promises]]
ptype = "config:domain"
key = "config:domain"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "secrets:runtime"
key = "secrets:runtime"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "storage:durable"
key = "storage:durable"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "backup:provider"
key = "backup:provider"
polarity = "use"
cardinality = "broadcast"
mandatory = true

[[promises]]
ptype = "ram"
key = "ram"
polarity = "use"
cardinality = "budgeted"
mandatory = true
amount = 384
priority = 0

[[promises]]
ptype = "https:ingress"
key = "https:ingress"
polarity = "offer"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "state:persist"
key = "/var/lib/vaultwarden"
polarity = "offer"
cardinality = "partitioned"
mandatory = true
tags = ["survives-reboot", "backup-required", "single-auth-writer"]
[promises.payload]
path = "/var/lib/vaultwarden"
