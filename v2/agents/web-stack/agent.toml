id = "web-stack"
description = "Nested Dressed Superagent (P-Explicit) encapsulating Caddy + Vaultwarden; hides `proxy:https` & `http:route` behind Σ while exposing coarse-grained budgets and state."
kind = "superagent"

contains = [
  {agent = "caddy"},
  {agent = "vaultwarden"},
]

[requires."config:domain"]
kind = "exclusive"

[requires."secrets:runtime"]
kind = "exclusive"

[offers."https:ingress"]
kind = "exclusive"

[budgets]
ram_mib = 384
tier = "critical"

[state.vaultwarden-data]
path = "/var/lib/vaultwarden"
traits = ["survives-reboot", "backup-required", "single-auth-writer"]
