id = "target-nixos-efi"
description = "UEFI NixOS bare-metal/VPS target declared purely with raw promises."

[[promises]]
ptype = "config:hostname"
key = "config:hostname"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "target:os"
key = "target:os"
polarity = "offer"
cardinality = "exclusive"
mandatory = true
[promises.payload]
target_class = "nixos"
output_attr = "toplevel"

[[promises]]
ptype = "hw:physical-block"
key = "hw:physical-block"
polarity = "offer"
cardinality = "exclusive"
mandatory = true
