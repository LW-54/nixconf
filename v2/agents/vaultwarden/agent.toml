id = "vaultwarden"
description = "Self-hosted password vault emitting partitioned `http:route` (+b), Agent-Declared State (S2+), and Parameter-as-Promise config."

[offers."route:vault"]
ptype = "http:route"
key = "vault"
kind = "partitioned"
tags = ["zone:public"]
subdomain = "vault"
port = 8222

[requires."proxy:https"]
kind = "exclusive"

[requires."config:domain"]
kind = "exclusive"

[requires."secrets:runtime"]
kind = "exclusive"

[budgets]
ram_mib = 256
tier = "critical"

[state.data]
path = "/var/lib/vaultwarden"
traits = ["survives-reboot", "backup-required", "single-auth-writer"]
