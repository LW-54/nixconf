id = "vaultwarden"
description = "Self-hosted password vault declared purely with raw promises (zero sugar)."

[[promises]]
ptype = "http:route"
key = "vault"
polarity = "offer"
cardinality = "partitioned"
mandatory = true
tags = ["zone:public"]
[promises.payload]
subdomain = "vault"
port = 8222

[[promises]]
ptype = "state:persist"
key = "/var/lib/vaultwarden"
polarity = "offer"
cardinality = "partitioned"
mandatory = true
tags = ["survives-reboot", "backup-required", "single-auth-writer"]
[promises.payload]
path = "/var/lib/vaultwarden"

[[promises]]
ptype = "proxy:https"
key = "proxy:https"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "config:domain"
key = "config:domain"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "secrets:runtime"
key = "secrets:runtime"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "storage:durable"
key = "storage:durable"
polarity = "use"
cardinality = "exclusive"
mandatory = true

[[promises]]
ptype = "backup:provider"
key = "backup:provider"
polarity = "use"
cardinality = "broadcast"
mandatory = true

[[promises]]
ptype = "ram"
key = "ram"
polarity = "use"
cardinality = "budgeted"
mandatory = true
amount = 256
priority = 0
