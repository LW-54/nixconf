id = "astrolabe"
description = "Production impermanent x86_64 VPS — closed root Dressed Superagent declared purely with raw promises."
attributes = ["role:server", "env:prod"]
profiles = ["base-server"]
contains = [
  {agent = "web-stack"},
]

[[internal_promises]]
ptype = "ram"
key = "ram"
polarity = "offer"
cardinality = "budgeted"
mandatory = true
amount = 11264

[[internal_promises]]
ptype = "backup:provider"
key = "offhost-default"
polarity = "offer"
cardinality = "broadcast"
mandatory = true

[[internal_promises]]
ptype = "secrets:runtime"
key = "secrets:runtime"
polarity = "offer"
cardinality = "exclusive"
mandatory = true

[[internal_promises]]
ptype = "config:hostname"
key = "config:hostname"
polarity = "offer"
cardinality = "exclusive"
mandatory = true
[internal_promises.payload]
value = "astrolabe"

[[internal_promises]]
ptype = "config:domain"
key = "config:domain"
polarity = "offer"
cardinality = "exclusive"
mandatory = true
[internal_promises.payload]
value = "astrolabe.example.org"

[[internal_promises]]
ptype = "config:primary-user"
key = "config:primary-user"
polarity = "offer"
cardinality = "exclusive"
mandatory = true
[internal_promises.payload]
name = "lw"
