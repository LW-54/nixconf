concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  host-tests:
    name: Host Tests (${{ matrix.host }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: disk-diff
        if: "matrix.hasInstall &&\ngithub.event_name == 'push'\n"
        name: Detect disk configuration changes
        run: "if git rev-parse HEAD~1 >/dev/null 2>&1; then\n  if git diff --name-only HEAD~1 HEAD | grep -E '(disko|impermanence|disk)' >/dev/null; then\n    echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\n    echo \"Disk configuration changed in this push; install tier will be triggered.\"\n    exit 0\n  fi\nfi\necho \"changed=false\" >> \"$GITHUB_OUTPUT\"\n"
      - id: cooldown-key
        name: Compute cooldown key
        run: "echo \"key=install-cooldown-${{ matrix.host }}-$(date -u +%Y-%m-%d)\" >> \"$GITHUB_OUTPUT\"\n"
      - id: cooldown
        if: "matrix.hasInstall &&\ngithub.event_name == 'push' &&\ngithub.ref == 'refs/heads/main'\n"
        name: Check install tier cooldown cache
        uses: actions/cache@v4
        with:
          key: ${{ steps.cooldown-key.outputs.key }}
          path: /tmp/install-cooldown-marker
      - if: "(github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host) &&\n(github.event_name != 'workflow_dispatch' || github.event.inputs.tier != 'static')\n"
        name: Enable KVM permissions
        run: "echo 'KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules\nsudo udevadm control --reload-rules\nsudo udevadm trigger --name-match=kvm\n[ -e /dev/kvm ] && sudo chmod 666 /dev/kvm || true\n"
      - if: "github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host\n"
        name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm\n"
      - if: "github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host\n"
        name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lw-54
      - if: "(github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host) &&\n(\n  github.event_name == 'schedule' ||\n  (github.event_name == 'workflow_dispatch' && (github.event.inputs.tier == 'all' || github.event.inputs.tier == 'static'))\n)\n"
        name: Static Verification (eval & inspect)
        run: "nix run .#test -- eval \"${{ matrix.host }}\"\nnix run .#test -- inspect \"${{ matrix.host }}\"\n"
      - if: "(github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host) &&\n(\n  github.event_name == 'schedule' ||\n  github.event_name == 'push' ||\n  (github.event_name == 'workflow_dispatch' && (github.event.inputs.tier == 'all' || github.event.inputs.tier == 'vm'))\n)\n"
        name: VM Runtime Tests (vm)
        run: "nix run .#test -- vm \"${{ matrix.host }}\"\n"
      - if: "matrix.hasInstall &&\n(github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host) &&\n(\n  github.event_name == 'schedule' ||\n  (github.event_name == 'workflow_dispatch' && (github.event.inputs.tier == 'all' || github.event.inputs.tier == 'install')) ||\n  (github.event_name == 'push' && (steps.disk-diff.outputs.changed == 'true' || (github.ref == 'refs/heads/main' && steps.cooldown.outputs.cache-hit != 'true')))\n)\n"
        name: Install & Storage Lifecycle Tests (install)
        run: "nix run .#test -- install \"${{ matrix.host }}\"\nmkdir -p /tmp/install-cooldown-marker\ndate -u > /tmp/install-cooldown-marker/timestamp\n"
    strategy:
      fail-fast: false
      matrix:
        include:
          - hasInstall: true
            host: astrolabe
          - hasInstall: true
            host: x240
name: Host Verification & VM Tests
'on':
  push:
    branches:
      - main
      - feat/**
  schedule:
    - cron: 0 3 * * *
  workflow_dispatch:
    inputs:
      host:
        default: all
        description: Host to test
        options:
          - all
          - astrolabe
          - x240
        required: true
        type: choice
      tier:
        default: vm
        description: Test tier to execute
        options:
          - all
          - static
          - vm
          - install
        required: true
        type: choice
permissions:
  contents: write
