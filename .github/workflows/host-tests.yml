concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  install-tests:
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.tier == 'all' || github.event.inputs.tier == 'install'))
    name: Install Tests (${{ matrix.host }})
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host
        name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: disk-diff
        if: (github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host) && github.event_name == 'push'
        name: Detect disk configuration changes
        run: "if git rev-parse HEAD~1 >/dev/null 2>&1; then\n  if git diff --name-only HEAD~1 HEAD | grep -E '(disko|impermanence|disk)' >/dev/null; then\n    echo \"changed=true\" >> \"$GITHUB_OUTPUT\"\n    echo \"Disk configuration changed in this push; install tier will be triggered.\"\n    exit 0\n  fi\nfi\necho \"changed=false\" >> \"$GITHUB_OUTPUT\"\n"
      - id: cooldown-key
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host
        name: Compute cooldown key
        run: "bucket=$(( $(date -u +%s) / 14400 ))\necho \"key=install-cooldown-${{ matrix.host }}-$bucket\" >> \"$GITHUB_OUTPUT\"\n"
      - id: cooldown
        if: (github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host) && github.event_name == 'push' && github.ref == 'refs/heads/main'
        name: Check install tier cooldown cache
        uses: actions/cache@v4
        with:
          key: ${{ steps.cooldown-key.outputs.key }}
          path: /tmp/install-cooldown-marker
      - id: should-run
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host
        name: Determine whether install tier should run
        run: "if [ \"${{ github.event_name }}\" = \"schedule\" ] || [ \"${{ github.event_name }}\" = \"workflow_dispatch\" ]; then\n  echo \"run=true\" >> \"$GITHUB_OUTPUT\"\nelif [ \"${{ steps.disk-diff.outputs.changed }}\" = \"true\" ]; then\n  echo \"run=true\" >> \"$GITHUB_OUTPUT\"\nelif [ \"${{ github.ref }}\" = \"refs/heads/main\" ] && [ \"${{ steps.cooldown.outputs.cache-hit }}\" != \"true\" ]; then\n  echo \"run=true\" >> \"$GITHUB_OUTPUT\"\nelse\n  echo \"run=false\" >> \"$GITHUB_OUTPUT\"\nfi\n"
      - if: steps.should-run.outputs.run == 'true'
        name: Cache Nix fetcher & eval cache
        uses: actions/cache@v4
        with:
          key: nix-cache-${{ runner.os }}-${{ hashFiles('.tack/pins.lock.json', 'flake.lock') }}
          path: ~/.cache/nix
          restore-keys: nix-cache-${{ runner.os }}-
      - if: steps.should-run.outputs.run == 'true'
        name: Enable KVM permissions
        run: "echo 'KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules\nsudo udevadm control --reload-rules\nsudo udevadm trigger --name-match=kvm\n[ -e /dev/kvm ] && sudo chmod 666 /dev/kvm || true\n"
      - if: steps.should-run.outputs.run == 'true'
        name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm\nextra-substituters = https://lw-54.cachix.org https://cache.adje.app/nixconf\nextra-trusted-public-keys = lw-54.cachix.org-1:1sScTQ6+QH/OBn5bCQEWz7LP090BE7njdpYTpxe5l0o= nixconf:JRUOgq7A0Q95V4A7ETuJnXJdbDI3xLZdG+PmCMEqZjE=\n"
      - if: steps.should-run.outputs.run == 'true'
        name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lw-54
      - env:
          HOST: ${{ matrix.host }}
        if: steps.should-run.outputs.run == 'true'
        name: Run Install & Storage Lifecycle Tests (install)
        run: "set -euo pipefail\nATTIC_URL=\"https://cache.adje.app/nixconf\"\nCACHIX_URL=\"https://lw-54.cachix.org\"\n\nt_start=\"$(date +%s)\"\nread -r drv out < <(\n  nix derivation show \".#legacyPackages.x86_64-linux.hostTests.${HOST}.install\" \\\n    | jq -r '(.derivations // .) | to_entries[0] | [(.key | if startswith(\"/nix/store/\") then . else \"/nix/store/\" + . end), ((.value.outputs.out // (.value.outputs | to_entries[0].value)).path | if startswith(\"/nix/store/\") then . else \"/nix/store/\" + . end)] | @tsv'\n)\nhash=\"${out#/nix/store/}\"\nhash=\"${hash%%-*}\"\n\nin_attic=0\nin_cachix=0\ncurl -fsI --max-time 5 \"${ATTIC_URL}/${hash}.narinfo\" >/dev/null 2>&1 && in_attic=1\ncurl -fsI --max-time 5 \"${CACHIX_URL}/${hash}.narinfo\" >/dev/null 2>&1 && in_cachix=1\n\nif [ \"$in_attic\" -eq 1 ] && [ \"$in_cachix\" -eq 1 ]; then\n  echo \"Test install for ${HOST} already cached in Attic & Cachix ($out) — skipping VM download/run.\"\n  status=\"cached (attic+cachix)\"\nelse\n  echo \"Running install for ${HOST} (attic=$in_attic cachix=$in_cachix)...\"\n  nix build --out-link /tmp/install-test-out -L \"${drv}^*\"\n  status=\"built (attic=$in_attic cachix=$in_cachix)\"\nfi\nmkdir -p /tmp/install-cooldown-marker\ndate -u > /tmp/install-cooldown-marker/timestamp\n\nt_dur=$(( $(date +%s) - t_start ))\nif [ -n \"${GITHUB_STEP_SUMMARY:-}\" ]; then\n  {\n    echo \"### Run Install & Storage Lifecycle Tests (install) (${HOST})\"\n    echo \"\"\n    echo \"| Host | Tier | Status | Duration |\"\n    echo \"| :--- | :--- | :--- | ---: |\"\n    echo \"| ${HOST} | install | $status | ${t_dur}s |\"\n  } >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
      - env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        if: (steps.should-run.outputs.run == 'true') && github.event_name != 'pull_request'
        name: Push test result to Attic binary cache (SOPS)
        run: "shopt -s nullglob\nouts=(/tmp/install-test-out*)\nif [ \"${#outs[@]}\" -eq 0 ]; then\n  echo \"No new test outputs built; skipping Attic push.\"\n  exit 0\nfi\nif [ -z \"${SOPS_AGE_KEY:-}\" ] || [ ! -f secrets/ci/attic.yaml ]; then\n  echo \"SOPS_AGE_KEY or secrets/ci/attic.yaml not configured; skipping Attic push.\"\n  exit 0\nfi\ntools=\"$(nix build --no-link --print-out-paths .#legacyPackages.x86_64-linux.ciAtticTools)\"\nATTIC_TOKEN=\"$(\"$tools/bin/sops\" -d --extract '[\"token\"]' secrets/ci/attic.yaml)\"\necho \"::add-mask::$ATTIC_TOKEN\"\n\"$tools/bin/attic\" login nixconf \"https://cache.adje.app\" \"$ATTIC_TOKEN\"\n\"$tools/bin/attic\" push -j 16 nixconf \"${outs[@]}\"\n"
    strategy:
      fail-fast: false
      matrix:
        host:
          - astrolabe
          - x240
  static-tests:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.tier == 'all' || github.event.inputs.tier == 'static'))
    name: Static Verification (${{ matrix.host }})
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host
        name: Checkout repository
        uses: actions/checkout@v4
      - if: github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host
        name: Cache Nix fetcher & eval cache
        uses: actions/cache@v4
        with:
          key: nix-cache-${{ runner.os }}-${{ hashFiles('.tack/pins.lock.json', 'flake.lock') }}
          path: ~/.cache/nix
          restore-keys: nix-cache-${{ runner.os }}-
      - if: github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host
        name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "extra-substituters = https://lw-54.cachix.org https://cache.adje.app/nixconf\nextra-trusted-public-keys = lw-54.cachix.org-1:1sScTQ6+QH/OBn5bCQEWz7LP090BE7njdpYTpxe5l0o= nixconf:JRUOgq7A0Q95V4A7ETuJnXJdbDI3xLZdG+PmCMEqZjE=\n"
      - if: github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host
        name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lw-54
      - if: github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host
        name: Run eval & inspect checks
        run: nix build --no-link -L ".#checks.x86_64-linux.eval-${{ matrix.host }}" ".#checks.x86_64-linux.inspect-${{ matrix.host }}"
    strategy:
      fail-fast: false
      matrix:
        host:
          - astrolabe
          - x240
  vm-tests:
    if: github.event_name == 'schedule' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (github.event.inputs.tier == 'all' || github.event.inputs.tier == 'vm'))
    name: VM Tests (${{ matrix.host }})
    runs-on: ubuntu-latest
    steps:
      - if: github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host
        name: Checkout repository
        uses: actions/checkout@v4
      - if: github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host
        name: Cache Nix fetcher & eval cache
        uses: actions/cache@v4
        with:
          key: nix-cache-${{ runner.os }}-${{ hashFiles('.tack/pins.lock.json', 'flake.lock') }}
          path: ~/.cache/nix
          restore-keys: nix-cache-${{ runner.os }}-
      - if: github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host
        name: Enable KVM permissions
        run: "echo 'KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules\nsudo udevadm control --reload-rules\nsudo udevadm trigger --name-match=kvm\n[ -e /dev/kvm ] && sudo chmod 666 /dev/kvm || true\n"
      - if: github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host
        name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm\nextra-substituters = https://lw-54.cachix.org https://cache.adje.app/nixconf\nextra-trusted-public-keys = lw-54.cachix.org-1:1sScTQ6+QH/OBn5bCQEWz7LP090BE7njdpYTpxe5l0o= nixconf:JRUOgq7A0Q95V4A7ETuJnXJdbDI3xLZdG+PmCMEqZjE=\n"
      - if: github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host
        name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lw-54
      - env:
          HOST: ${{ matrix.host }}
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host
        name: Run VM Runtime Tests (vm)
        run: "set -euo pipefail\nATTIC_URL=\"https://cache.adje.app/nixconf\"\nCACHIX_URL=\"https://lw-54.cachix.org\"\n\nt_start=\"$(date +%s)\"\nread -r drv out < <(\n  nix derivation show \".#legacyPackages.x86_64-linux.hostTests.${HOST}.vm\" \\\n    | jq -r '(.derivations // .) | to_entries[0] | [(.key | if startswith(\"/nix/store/\") then . else \"/nix/store/\" + . end), ((.value.outputs.out // (.value.outputs | to_entries[0].value)).path | if startswith(\"/nix/store/\") then . else \"/nix/store/\" + . end)] | @tsv'\n)\nhash=\"${out#/nix/store/}\"\nhash=\"${hash%%-*}\"\n\nin_attic=0\nin_cachix=0\ncurl -fsI --max-time 5 \"${ATTIC_URL}/${hash}.narinfo\" >/dev/null 2>&1 && in_attic=1\ncurl -fsI --max-time 5 \"${CACHIX_URL}/${hash}.narinfo\" >/dev/null 2>&1 && in_cachix=1\n\nif [ \"$in_attic\" -eq 1 ] && [ \"$in_cachix\" -eq 1 ]; then\n  echo \"Test vm for ${HOST} already cached in Attic & Cachix ($out) — skipping VM download/run.\"\n  status=\"cached (attic+cachix)\"\nelse\n  echo \"Running vm for ${HOST} (attic=$in_attic cachix=$in_cachix)...\"\n  nix build --out-link /tmp/vm-test-out -L \"${drv}^*\"\n  status=\"built (attic=$in_attic cachix=$in_cachix)\"\nfi\n\nt_dur=$(( $(date +%s) - t_start ))\nif [ -n \"${GITHUB_STEP_SUMMARY:-}\" ]; then\n  {\n    echo \"### Run VM Runtime Tests (vm) (${HOST})\"\n    echo \"\"\n    echo \"| Host | Tier | Status | Duration |\"\n    echo \"| :--- | :--- | :--- | ---: |\"\n    echo \"| ${HOST} | vm | $status | ${t_dur}s |\"\n  } >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
      - env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        if: (github.event_name != 'workflow_dispatch' || github.event.inputs.host == 'all' || github.event.inputs.host == matrix.host) && github.event_name != 'pull_request'
        name: Push test result to Attic binary cache (SOPS)
        run: "shopt -s nullglob\nouts=(/tmp/vm-test-out*)\nif [ \"${#outs[@]}\" -eq 0 ]; then\n  echo \"No new test outputs built; skipping Attic push.\"\n  exit 0\nfi\nif [ -z \"${SOPS_AGE_KEY:-}\" ] || [ ! -f secrets/ci/attic.yaml ]; then\n  echo \"SOPS_AGE_KEY or secrets/ci/attic.yaml not configured; skipping Attic push.\"\n  exit 0\nfi\ntools=\"$(nix build --no-link --print-out-paths .#legacyPackages.x86_64-linux.ciAtticTools)\"\nATTIC_TOKEN=\"$(\"$tools/bin/sops\" -d --extract '[\"token\"]' secrets/ci/attic.yaml)\"\necho \"::add-mask::$ATTIC_TOKEN\"\n\"$tools/bin/attic\" login nixconf \"https://cache.adje.app\" \"$ATTIC_TOKEN\"\n\"$tools/bin/attic\" push -j 16 nixconf \"${outs[@]}\"\n"
    strategy:
      fail-fast: false
      matrix:
        host:
          - astrolabe
          - x240
name: Host Verification & VM Tests
'on':
  push:
    branches:
      - main
      - feat/**
  schedule:
    - cron: 0 3 * * *
  workflow_dispatch:
    inputs:
      host:
        default: all
        description: Host to test
        options:
          - all
          - astrolabe
          - x240
        required: true
        type: choice
      tier:
        default: vm
        description: Test tier to execute
        options:
          - all
          - static
          - vm
          - install
        required: true
        type: choice
permissions:
  contents: write
