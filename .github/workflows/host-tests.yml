concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  vm-tests:
    name: VM Runtime Tests (${{ matrix.host }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Enable KVM permissions
        run: "echo 'KERNEL==\"kvm\", GROUP=\"kvm\", MODE=\"0666\", OPTIONS+=\"static_node=kvm\"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules\nsudo udevadm control --reload-rules\nsudo udevadm trigger --name-match=kvm\n[ -e /dev/kvm ] && sudo chmod 666 /dev/kvm || true\n"
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "system-features = nixos-test benchmark big-parallel kvm\n"
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lw-54
      - name: Run VM test
        run: nix build -L '.#legacyPackages.x86_64-linux.hostTests.${{ matrix.host }}.vm'
    strategy:
      fail-fast: false
      matrix:
        host:
          - astrolabe
          - x240
name: Host Verification & VM Tests
'on':
  push:
    branches:
      - main
      - feat/**
  workflow_dispatch:
    inputs:
      host:
        default: all
        description: Host to test
        options:
          - all
          - astrolabe
          - x240
        required: true
        type: choice
      tier:
        default: all
        description: Test tier to execute
        options:
          - all
          - static
          - vm
          - install
        required: true
        type: choice
permissions:
  contents: write
