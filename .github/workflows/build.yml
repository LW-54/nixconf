name: CI & Binary Cache Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Cachix Cache
        uses: cachix/cachix-action@v17
        with:
          name: lw-54
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run flake checks
        run: nix flake check

      - name: Build all common flake outputs
        shell: bash
        run: |
          set -euo pipefail

          flake_json="$(nix flake show --json)"

          for category in packages apps checks formatter devShells nixosConfigurations; do
            if ! jq -e --arg c "$category" 'has($c)' <<<"$flake_json" >/dev/null 2>&1; then
              echo "Skipping missing category: $category"
              continue
            fi

            case "$category" in
              packages|apps|checks|formatter|devShells)
                while IFS= read -r target; do
                  [ -n "$target" ] || continue
                  echo "==> Building .$target"
                  nix build ".#$target" --no-link || echo "missing output: $target"
                done < <(
                  jq -r --arg c "$category" '
                    .[$c] | to_entries[] |
                    (.key) as $system |
                    (.value | if type == "object" then to_entries[] | "\($c).\($system).\(.key)" else "\($c).\($system)" end)
                  ' <<<"$flake_json"
                )
                ;;
              nixosConfigurations)
                while IFS= read -r host; do
                  [ -n "$host" ] || continue
                  target="nixosConfigurations.$host.config.system.build.toplevel"
                  echo "==> Building .#$target"
                  nix build ".#$target" --no-link || echo "missing output: $target"
                done < <(
                  jq -r --arg c "$category" '.[$c] | keys[]' <<<"$flake_json"
                )
                ;;
            esac
          done