concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  build:
    name: Build & Cache (${{ matrix.target }})
    needs:
      - check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lw-54
      - name: Build derivation
        run: nix build -L '.#legacyPackages.x86_64-linux.ciBuildables."${{ matrix.target }}"'
    strategy:
      fail-fast: false
      matrix:
        target:
          - checks-ci
          - checks-docs
          - checks-eval-astrolabe
          - checks-eval-x240
          - checks-inspect-astrolabe
          - checks-inspect-x240
          - checks-schemas
          - devShells-default
          - devShells-github-ssh
          - devShells-master-ssh
          - devShells-sops-admin
          - devShells-sops-host
          - formatter
          - host-astrolabe
          - host-x240
          - packages-antigravity
          - packages-antigravity-cli
          - packages-antigravity-ide
          - packages-bw
          - packages-ci
          - packages-cpg-json
          - packages-devenv-test
          - packages-devenv-up
          - packages-docs
          - packages-dolphin
          - packages-foot
          - packages-git
          - packages-graph
          - packages-nixconf-json
          - packages-test
  check:
    name: Flake Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lw-54
      - name: Run flake check
        run: nix flake check
name: CI & Binary Cache Push
'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}
