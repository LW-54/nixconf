concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}
jobs:
  checks-meta:
    name: Meta Checks (schemas, docs, ci)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache Nix fetcher & eval cache
        uses: actions/cache@v4
        with:
          key: nix-cache-${{ runner.os }}-${{ hashFiles('.tack/pins.lock.json', 'flake.lock') }}
          path: ~/.cache/nix
          restore-keys: nix-cache-${{ runner.os }}-
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "extra-substituters = https://lw-54.cachix.org https://cache.adje.app/nixconf\nextra-trusted-public-keys = lw-54.cachix.org-1:1sScTQ6+QH/OBn5bCQEWz7LP090BE7njdpYTpxe5l0o= nixconf:JRUOgq7A0Q95V4A7ETuJnXJdbDI3xLZdG+PmCMEqZjE=\n"
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lw-54
      - name: Build meta checks in one shared evaluation
        run: "nix build --no-link -L \\\n  .#checks.x86_64-linux.schemas \\\n  .#checks.x86_64-linux.docs \\\n  .#checks.x86_64-linux.ci"
      - name: Guard derivation cache isolation (README.md mutation)
        run: "set -euo pipefail\nprobe() {\n  nix eval --no-eval-cache --json --apply 'b: {\n    eval_astrolabe = b.checks-eval-astrolabe.outPath;\n    eval_x240 = b.checks-eval-x240.outPath;\n    ci = b.packages-ci.outPath;\n    menu = b.packages-menu.outPath;\n  }' .#legacyPackages.x86_64-linux.ciBuildables\n}\nbefore=\"$(probe)\"\ntrap 'git checkout -- README.md' EXIT\nprintf '\\n<!-- cache-isolation-probe -->\\n' >> README.md\nafter=\"$(probe)\"\nif [ \"$before\" != \"$after\" ]; then\n  echo \"ERROR: Editing README.md invalidated non-docs derivations (possible \\${self} leak)!\" >&2\n  echo \"Before: $before\" >&2\n  echo \"After:  $after\" >&2\n  exit 1\nfi\necho \"Cache isolation verified: 0 non-docs derivations invalidated by README.md edit.\"\n"
  host:
    name: Host (${{ matrix.host }})
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache Nix fetcher & eval cache
        uses: actions/cache@v4
        with:
          key: nix-cache-${{ runner.os }}-${{ hashFiles('.tack/pins.lock.json', 'flake.lock') }}
          path: ~/.cache/nix
          restore-keys: nix-cache-${{ runner.os }}-
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "extra-substituters = https://lw-54.cachix.org https://cache.adje.app/nixconf\nextra-trusted-public-keys = lw-54.cachix.org-1:1sScTQ6+QH/OBn5bCQEWz7LP090BE7njdpYTpxe5l0o= nixconf:JRUOgq7A0Q95V4A7ETuJnXJdbDI3xLZdG+PmCMEqZjE=\n"
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lw-54
      - env:
          HOST: ${{ matrix.host }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        name: Evaluate, inspect, and build uncached host outputs
        run: "set -euo pipefail\nATTIC_URL=\"https://cache.adje.app/nixconf\"\nCACHIX_URL=\"https://lw-54.cachix.org\"\nNIXOS_URL=\"https://cache.nixos.org\"\n\nnix derivation show \".#checks.x86_64-linux.eval-${HOST}\" \\\n          \".#checks.x86_64-linux.inspect-${HOST}\" \\\n          \".#nixosConfigurations.${HOST}.config.system.build.toplevel\" \\\n  | jq -r '(.derivations // .) | to_entries[] | [(.key | if startswith(\"/nix/store/\") then . else \"/nix/store/\" + . end), ((.value.outputs.out // (.value.outputs | to_entries[0].value)).path | if startswith(\"/nix/store/\") then . else \"/nix/store/\" + . end)] | @tsv' \\\n  > /tmp/ci-targets.tsv\n\nrm -rf /tmp/ci-miss\nmkdir -p /tmp/ci-miss\nwhile IFS=$'\\t' read -r drv out; do\n  hash=\"${out#/nix/store/}\"\n  hash=\"${hash%%-*}\"\n  (\n    in_nixos=0\n    in_attic=0\n    in_cachix=0\n    curl -fsI --max-time 5 \"${NIXOS_URL}/${hash}.narinfo\" >/dev/null 2>&1 && in_nixos=1\n    if [ \"$in_nixos\" -eq 0 ]; then\n      curl -fsI --max-time 5 \"${ATTIC_URL}/${hash}.narinfo\" >/dev/null 2>&1 && in_attic=1\n      curl -fsI --max-time 5 \"${CACHIX_URL}/${hash}.narinfo\" >/dev/null 2>&1 && in_cachix=1\n    fi\n    if [ \"$in_nixos\" -eq 1 ]; then\n      echo \"  [cached:nixos] $out\"\n    elif [ \"${IS_PR:-false}\" = \"true\" ] && { [ \"$in_attic\" -eq 1 ] || [ \"$in_cachix\" -eq 1 ]; }; then\n      echo \"  [cached:pr] $out\"\n    elif [ \"$in_attic\" -eq 1 ] && [ \"$in_cachix\" -eq 1 ]; then\n      echo \"  [cached:attic+cachix] $out\"\n    else\n      echo \"  [build:attic=$in_attic cachix=$in_cachix] $out\"\n      printf '%s^*\\n' \"$drv\" > \"/tmp/ci-miss/${hash}\"\n    fi\n  ) &\ndone < /tmp/ci-targets.tsv\nwait\n\nshopt -s nullglob\nmiss_files=(/tmp/ci-miss/*)\ntotal_targets=\"$(wc -l < /tmp/ci-targets.tsv)\"\nmiss_count=\"${#miss_files[@]}\"\nhit_count=$((total_targets - miss_count))\nt_start=\"$(date +%s)\"\nif [ \"$miss_count\" -eq 0 ]; then\n  echo \"All $total_targets target(s) already cached in Attic & Cachix — skipping multi-GB download.\"\nelse\n  mapfile -t MISSING < <(cat \"${miss_files[@]}\")\n  echo \"Building $miss_count / $total_targets uncached target(s)...\"\n  nix build --out-link /tmp/host-out  -L \"${MISSING[@]}\"\nfi\nt_dur=$(( $(date +%s) - t_start ))\nif [ -n \"${GITHUB_STEP_SUMMARY:-}\" ]; then\n  {\n    echo \"### Evaluate, inspect, and build uncached host outputs\"\n    echo \"\"\n    echo \"| Targets | Cache Hits | Built | Build Time |\"\n    echo \"| ---: | ---: | ---: | ---: |\"\n    echo \"| $total_targets | $hit_count | $miss_count | ${t_dur}s |\"\n  } >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
      - env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        if: github.event_name != 'pull_request'
        name: Push to Attic binary cache (SOPS)
        run: "shopt -s nullglob\nouts=(/tmp/host-out*)\nif [ \"${#outs[@]}\" -eq 0 ]; then\n  echo \"No new outputs built; skipping Attic push.\"\n  exit 0\nfi\nif [ -z \"${SOPS_AGE_KEY:-}\" ] || [ ! -f secrets/ci/attic.yaml ]; then\n  echo \"SOPS_AGE_KEY or secrets/ci/attic.yaml not configured; skipping Attic push.\"\n  exit 0\nfi\ntools=\"$(nix build --no-link --print-out-paths .#legacyPackages.x86_64-linux.ciAtticTools)\"\nATTIC_TOKEN=\"$(\"$tools/bin/sops\" -d --extract '[\"token\"]' secrets/ci/attic.yaml)\"\necho \"::add-mask::$ATTIC_TOKEN\"\n\"$tools/bin/attic\" login nixconf \"https://cache.adje.app\" \"$ATTIC_TOKEN\"\n\"$tools/bin/attic\" push -j 16 nixconf \"${outs[@]}\"\n"
    strategy:
      fail-fast: false
      matrix:
        host:
          - astrolabe
          - x240
  lint:
    name: Formatting (Alejandra)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache Nix fetcher & eval cache
        uses: actions/cache@v4
        with:
          key: nix-cache-${{ runner.os }}-${{ hashFiles('.tack/pins.lock.json', 'flake.lock') }}
          path: ~/.cache/nix
          restore-keys: nix-cache-${{ runner.os }}-
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "extra-substituters = https://lw-54.cachix.org https://cache.adje.app/nixconf\nextra-trusted-public-keys = lw-54.cachix.org-1:1sScTQ6+QH/OBn5bCQEWz7LP090BE7njdpYTpxe5l0o= nixconf:JRUOgq7A0Q95V4A7ETuJnXJdbDI3xLZdG+PmCMEqZjE=\n"
      - name: Check Nix formatting
        run: nix run .#formatter.x86_64-linux -- --check .
  packages-and-shells:
    name: Packages & DevShells (Single Eval)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cache Nix fetcher & eval cache
        uses: actions/cache@v4
        with:
          key: nix-cache-${{ runner.os }}-${{ hashFiles('.tack/pins.lock.json', 'flake.lock') }}
          path: ~/.cache/nix
          restore-keys: nix-cache-${{ runner.os }}-
      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: "extra-substituters = https://lw-54.cachix.org https://cache.adje.app/nixconf\nextra-trusted-public-keys = lw-54.cachix.org-1:1sScTQ6+QH/OBn5bCQEWz7LP090BE7njdpYTpxe5l0o= nixconf:JRUOgq7A0Q95V4A7ETuJnXJdbDI3xLZdG+PmCMEqZjE=\n"
      - name: Setup Cachix
        uses: cachix/cachix-action@v17
        with:
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}
          name: lw-54
      - env:
          IS_PR: ${{ github.event_name == 'pull_request' }}
        name: Build & cache uncached packages and devShells in one evaluation
        run: "set -euo pipefail\nATTIC_URL=\"https://cache.adje.app/nixconf\"\nCACHIX_URL=\"https://lw-54.cachix.org\"\nNIXOS_URL=\"https://cache.nixos.org\"\n\nnix derivation show .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"devShells-default\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"devShells-gemini-api\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"devShells-github-cli\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"devShells-github-ssh\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"devShells-master-ssh\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"devShells-sops-admin\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"devShells-sops-host\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"devShells-storage-admin\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"formatter\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-agent-git-bootstrap\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-agy\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-agy-api\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-antigravity\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-antigravity-ide\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-attic-bootstrap\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-bw\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-ci\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-cpg-json\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-docs\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-dolphin\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-foot\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-git\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-graph\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-menu\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-micro\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-nixconf-json\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-prof\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-storage\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-test\" \\\n          .#legacyPackages.x86_64-linux.ciPackagesAndShells.\"packages-zed\" \\\n  | jq -r '(.derivations // .) | to_entries[] | [(.key | if startswith(\"/nix/store/\") then . else \"/nix/store/\" + . end), ((.value.outputs.out // (.value.outputs | to_entries[0].value)).path | if startswith(\"/nix/store/\") then . else \"/nix/store/\" + . end)] | @tsv' \\\n  > /tmp/ci-targets.tsv\n\nrm -rf /tmp/ci-miss\nmkdir -p /tmp/ci-miss\nwhile IFS=$'\\t' read -r drv out; do\n  hash=\"${out#/nix/store/}\"\n  hash=\"${hash%%-*}\"\n  (\n    in_nixos=0\n    in_attic=0\n    in_cachix=0\n    curl -fsI --max-time 5 \"${NIXOS_URL}/${hash}.narinfo\" >/dev/null 2>&1 && in_nixos=1\n    if [ \"$in_nixos\" -eq 0 ]; then\n      curl -fsI --max-time 5 \"${ATTIC_URL}/${hash}.narinfo\" >/dev/null 2>&1 && in_attic=1\n      curl -fsI --max-time 5 \"${CACHIX_URL}/${hash}.narinfo\" >/dev/null 2>&1 && in_cachix=1\n    fi\n    if [ \"$in_nixos\" -eq 1 ]; then\n      echo \"  [cached:nixos] $out\"\n    elif [ \"${IS_PR:-false}\" = \"true\" ] && { [ \"$in_attic\" -eq 1 ] || [ \"$in_cachix\" -eq 1 ]; }; then\n      echo \"  [cached:pr] $out\"\n    elif [ \"$in_attic\" -eq 1 ] && [ \"$in_cachix\" -eq 1 ]; then\n      echo \"  [cached:attic+cachix] $out\"\n    else\n      echo \"  [build:attic=$in_attic cachix=$in_cachix] $out\"\n      printf '%s^*\\n' \"$drv\" > \"/tmp/ci-miss/${hash}\"\n    fi\n  ) &\ndone < /tmp/ci-targets.tsv\nwait\n\nshopt -s nullglob\nmiss_files=(/tmp/ci-miss/*)\ntotal_targets=\"$(wc -l < /tmp/ci-targets.tsv)\"\nmiss_count=\"${#miss_files[@]}\"\nhit_count=$((total_targets - miss_count))\nt_start=\"$(date +%s)\"\nif [ \"$miss_count\" -eq 0 ]; then\n  echo \"All $total_targets target(s) already cached in Attic & Cachix — skipping multi-GB download.\"\nelse\n  mapfile -t MISSING < <(cat \"${miss_files[@]}\")\n  echo \"Building $miss_count / $total_targets uncached target(s)...\"\n  nix build --out-link /tmp/pkg-out --keep-going -L \"${MISSING[@]}\"\nfi\nt_dur=$(( $(date +%s) - t_start ))\nif [ -n \"${GITHUB_STEP_SUMMARY:-}\" ]; then\n  {\n    echo \"### Build & cache uncached packages and devShells in one evaluation\"\n    echo \"\"\n    echo \"| Targets | Cache Hits | Built | Build Time |\"\n    echo \"| ---: | ---: | ---: | ---: |\"\n    echo \"| $total_targets | $hit_count | $miss_count | ${t_dur}s |\"\n  } >> \"$GITHUB_STEP_SUMMARY\"\nfi\n"
      - env:
          SOPS_AGE_KEY: ${{ secrets.SOPS_AGE_KEY }}
        if: github.event_name != 'pull_request'
        name: Push to Attic binary cache (SOPS)
        run: "shopt -s nullglob\nouts=(/tmp/pkg-out*)\nif [ \"${#outs[@]}\" -eq 0 ]; then\n  echo \"No new outputs built; skipping Attic push.\"\n  exit 0\nfi\nif [ -z \"${SOPS_AGE_KEY:-}\" ] || [ ! -f secrets/ci/attic.yaml ]; then\n  echo \"SOPS_AGE_KEY or secrets/ci/attic.yaml not configured; skipping Attic push.\"\n  exit 0\nfi\ntools=\"$(nix build --no-link --print-out-paths .#legacyPackages.x86_64-linux.ciAtticTools)\"\nATTIC_TOKEN=\"$(\"$tools/bin/sops\" -d --extract '[\"token\"]' secrets/ci/attic.yaml)\"\necho \"::add-mask::$ATTIC_TOKEN\"\n\"$tools/bin/attic\" login nixconf \"https://cache.adje.app\" \"$ATTIC_TOKEN\"\n\"$tools/bin/attic\" push -j 16 nixconf \"${outs[@]}\"\n"
name: CI & Binary Cache Push
'on':
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch: {}
