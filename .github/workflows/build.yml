name: CI & Binary Cache Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v31

      - name: Setup Cachix Cache
        uses: cachix/cachix-action@v17
        with:
          name: lw-54
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Run flake checks
        run: nix flake check

      - name: Build all common flake outputs
        shell: bash
        run: |
          set -euo pipefail

          for target in \
            packages.x86_64-linux \
            apps.x86_64-linux \
            checks.x86_64-linux \
            formatter.x86_64-linux \
            devShells.x86_64-linux \
            nixosConfigurations
          do
            if nix eval --quiet --expr "let flake = builtins.getFlake (toString ./.); in builtins.hasAttr \"${target#*.}\" (flake.${target%%.*})" >/dev/null 2>&1; then
              echo "Building $target"
              nix build .#$target --all --no-link
            else
              echo "Skipping missing output: $target"
            fi
          done