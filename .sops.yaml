keys:
  admin: &admin_key age1yph7kqs5wq2hf4edt2f648en0unpjak7nps9u5v8r43ev9fvsewsmuahjk
  x240: &x240_key age14fnlmar7dt4nzu3dayql669mavuvd5epn0vrplg76jwpesq3dvnqr6d9zy
  astrolabe: &astrolabe_key age173rv8hnu7sa66u8583hyp0pjuwzjxsfepr4cmtxzeklazpq5la9szp35hk

tags:
  base: &base
    merge:
      - age:
          - *admin_key

  personal: &personal
    <<: *base
    age:
      - *x240_key

  servers: &servers
    <<: *base
    age:
      - *astrolabe_key

  host_x240: &host_x240
    <<: *base
    age:
      - *x240_key

  host_astrolabe: &host_astrolabe
    <<: *base
    age:
      - *astrolabe_key

  all: &all
    <<: *base
    age:
      - *x240_key
      - *astrolabe_key

creation_rules:
  - path_regex: ^secrets/admin/.*$
    key_groups:
      - *base
  - path_regex: ^secrets/hosts/x240/.*$
    key_groups:
      - *host_x240
  - path_regex: ^secrets/hosts/astrolabe/.*$
    key_groups:
      - *host_astrolabe
  - path_regex: ^secrets/services/.*$
    key_groups:
      - *servers
  - path_regex: ^secrets/wifi/.*$
    key_groups:
      - *personal
  - path_regex: ^secrets/.*$
    key_groups:
      - *all
