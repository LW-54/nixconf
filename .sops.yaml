keys:
  admin: &admin_key age1yph7kqs5wq2hf4edt2f648en0unpjak7nps9u5v8r43ev9fvsewsmuahjk
  x240: &x240_key age14fnlmar7dt4nzu3dayql669mavuvd5epn0vrplg76jwpesq3dvnqr6d9zy
  astrolabe: &astrolabe_key age173rv8hnu7sa66u8583hyp0pjuwzjxsfepr4cmtxzeklazpq5la9szp35hk

tags:
  base: &base
    merge:
      - age:
          - *admin_key

  personal: &personal
    <<: *base
    age:
      - *x240_key

  server: &server
    <<: *base
    age:
      - *astrolabe_key

  all_hosts: &all_hosts
    <<: *base
    age:
      - *x240_key
      - *astrolabe_key

creation_rules:
  - path_regex: ^secrets/recovery/.*$
    key_groups:
      - *base
  - path_regex: ^secrets/ssh/.*$
    key_groups:
      - *all_hosts
  - path_regex: ^secrets/backup/.*$
    key_groups:
      - *server
  - path_regex: ^secrets/services/.*$
    key_groups:
      - *server
  - path_regex: ^secrets/hosts/astrolabe(/.*)?$
    key_groups:
      - *server
  - path_regex: ^secrets/.*$
    key_groups:
      - *personal
